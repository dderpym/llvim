# llvim tmux config: no keyboard binds at all except a panic exit; a few mouse binds, the wheel included.
# Run with:  tmux -L llvim -f tmux.conf   (separate server, never touches ~/.tmux.conf)

# --- sane defaults ---
set -g prefix None
set -g mouse on
set -g status off
set -g escape-time 0
set -g window-size latest  # several clients on one session: the newest sets the size, not the smallest
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g set-clipboard on
set -g mode-keys vi
set -g extended-keys on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:extkeys"  # ask the terminal for modified keys (shift-enter) where it can give them (not kitty: see docs/std/panels/input/input.md)
set -as terminal-features ",*:clipboard"  # let a program (the viewer) copy to the clipboard of your terminal with OSC 52
set -g allow-passthrough on
set -g pane-border-lines heavy
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour76"

# --- no keybinds ---
unbind -a -T prefix
unbind -a -T root
unbind -a -T copy-mode
unbind -a -T copy-mode-vi
unbind -a -T move

# --- panic exit: Ctrl+Alt+Q kills the whole llvim server (works in any terminal, no CSI-u needed) ---
bind -n C-M-q kill-server

# --- mouse: click to focus, drag a border to resize, Alt+drag to move a (floating) pane ---
bind -n MouseDown1Pane select-pane -t = \; send-keys -M
bind -n MouseDown1Border select-pane -t =
bind -n MouseDrag1Border resize-pane -M
bind -n M-MouseDrag1Pane move-pane -M
bind -n M-MouseDrag1Border move-pane -M

# --- scrolling: the wheel walks back through a pane's history; scrolling down to the end leaves history again ---
# (a program that asks for the mouse gets the wheel itself)
bind -n WheelUpPane if -F -t = "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# --- a running server keeps the environment it started with; sessions started later get these from their client ---
set -ga update-environment "LLVIM_HOME LLVIM_STORE LLVIM_MODEL"
